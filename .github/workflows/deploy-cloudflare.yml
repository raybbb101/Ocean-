# Deploys the game + account server to Cloudflare Pages (with a D1 database for saves) on every push.
# One-time setup in GitHub: Settings → Secrets and variables → Actions → New repository secret
#   CLOUDFLARE_API_TOKEN   Cloudflare dashboard → My Profile → API Tokens → Create Token → Custom token with
#                          Account permissions: "Cloudflare Pages: Edit" and "D1: Edit"
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare dashboard → Workers & Pages → Account ID (right sidebar)
name: Deploy to Cloudflare Pages

on:
  push:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      PROJECT: deep-dive-explorers
      DB_NAME: deep-dive-saves
    steps:
      - uses: actions/checkout@v4

      - name: Check Cloudflare secrets
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets are not set - skipping deploy."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ok == 'true'
        with:
          node-version: 20

      - name: Install wrangler
        if: steps.check.outputs.ok == 'true'
        run: npm install --no-save wrangler@3

      - name: Build site folder
        if: steps.check.outputs.ok == 'true'
        run: ./build.sh

      - name: Create the save database (first run only) and write wrangler.toml
        if: steps.check.outputs.ok == 'true'
        run: |
          npx wrangler d1 create "$DB_NAME" || true
          DB_ID=$(npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const db=JSON.parse(s).find(d=>d.name===process.argv[1]);if(!db)process.exit(1);console.log(db.uuid)})' "$DB_NAME")
          cat > wrangler.toml <<TOML
          name = "$PROJECT"
          pages_build_output_dir = "dist"
          compatibility_date = "2024-09-01"

          [[d1_databases]]
          binding = "DB"
          database_name = "$DB_NAME"
          database_id = "$DB_ID"
          TOML
          sed -i 's/^          //' wrangler.toml
          cat wrangler.toml

      - name: Create Pages project (first run only)
        if: steps.check.outputs.ok == 'true'
        run: npx wrangler pages project create "$PROJECT" --production-branch=main || true

      # The repo's default branch is the live site (production); other branches get preview links.
      - name: Deploy
        if: steps.check.outputs.ok == 'true'
        run: |
          BRANCH="$GITHUB_REF_NAME"
          if [ "$BRANCH" = "$DEFAULT_BRANCH" ]; then BRANCH=main; fi
          npx wrangler pages deploy --branch="$BRANCH" --commit-dirty=true
