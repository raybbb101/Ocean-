# Deploys the game to Cloudflare Pages on every push.
# One-time setup in GitHub: Settings → Secrets and variables → Actions → New repository secret
#   CLOUDFLARE_API_TOKEN   (Cloudflare dashboard → My Profile → API Tokens → "Edit Cloudflare Workers" template,
#                           or a custom token with Account › Cloudflare Pages › Edit)
#   CLOUDFLARE_ACCOUNT_ID  (Cloudflare dashboard → Workers & Pages → Account ID in the right sidebar)
name: Deploy to Cloudflare Pages

on:
  push:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: deep-dive-explorers
    steps:
      - uses: actions/checkout@v4

      - name: Check Cloudflare secrets
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets are not set - skipping deploy."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build site folder
        if: steps.check.outputs.ok == 'true'
        run: |
          mkdir dist
          cp -r index.html css js vendor _headers dist/

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ok == 'true'
        with:
          node-version: 20

      - name: Create Pages project (first run only)
        if: steps.check.outputs.ok == 'true'
        run: npx --yes wrangler@3 pages project create "$PROJECT" --production-branch=main || true

      - name: Deploy
        if: steps.check.outputs.ok == 'true'
        run: npx --yes wrangler@3 pages deploy dist --project-name="$PROJECT" --branch="${GITHUB_REF_NAME}" --commit-dirty=true
