# Deploys the game + account server to Cloudflare Pages (with a D1 database for saves) on every push.
# One-time setup in GitHub: Settings → Secrets and variables → Actions → New repository secret
#   CLOUDFLARE_API_TOKEN   Cloudflare dashboard → My Profile → API Tokens → Create Token → Custom token with
#                          Account permissions: "Cloudflare Pages: Edit" and "D1: Edit"
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare dashboard → Workers & Pages → Account ID (right sidebar)
name: Deploy to Cloudflare Pages

on:
  push:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      PROJECT: deep-dive-explorers
      DB_NAME: deep-dive-saves
    steps:
      - uses: actions/checkout@v4

      - name: Check Cloudflare secrets
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets are not set - skipping deploy."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ok == 'true'
        with:
          node-version: 20

      - name: Install wrangler
        if: steps.check.outputs.ok == 'true'
        run: npm install --no-save wrangler@3

      - name: Build site folder
        if: steps.check.outputs.ok == 'true'
        run: ./build.sh

      - name: Check the API token can reach your Cloudflare account
        if: steps.check.outputs.ok == 'true'
        run: |
          # Ask Cloudflare directly whether the token is valid (works for user and account tokens).
          verify() { curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$1" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const r=JSON.parse(s);process.exit(r.success&&r.result&&r.result.status==="active"?0:1)}catch{process.exit(1)}})'; }
          echo "Token length: ${#CLOUDFLARE_API_TOKEN} characters (a Cloudflare API token is about 40)"
          if verify "https://api.cloudflare.com/client/v4/user/tokens/verify" || verify "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify"; then
            echo "API token is valid and active."
          else
            echo "::error::Cloudflare says this API token is not valid. Copy the token's secret value (shown only once after Create/Roll, about 40 characters) into the CLOUDFLARE_API_TOKEN secret - not the token name, ID or the Global API Key."
            exit 1
          fi

      - name: Create the save database (first run only) and write wrangler.toml
        if: steps.check.outputs.ok == 'true'
        run: |
          if ! npx wrangler d1 list --json > d1.json 2> d1.err; then
            cat d1.err
            echo "::error::The API token is not allowed to use D1 databases. In Cloudflare → My Profile → API Tokens, edit the token and add the permission  Account · D1 · Edit  (and check CLOUDFLARE_ACCOUNT_ID is the same account). Then re-run this workflow."
            exit 1
          fi
          find_db() { node -e 'const l=JSON.parse(require("fs").readFileSync("d1.json","utf8"));const d=l.find(x=>x.name===process.argv[1]);if(d)console.log(d.uuid)' "$DB_NAME"; }
          DB_ID=$(find_db)
          if [ -z "$DB_ID" ]; then
            npx wrangler d1 create "$DB_NAME"
            npx wrangler d1 list --json > d1.json
            DB_ID=$(find_db)
          fi
          if [ -z "$DB_ID" ]; then echo "::error::Could not create the D1 database $DB_NAME"; exit 1; fi
          cat > wrangler.toml <<TOML
          name = "$PROJECT"
          pages_build_output_dir = "dist"
          compatibility_date = "2024-09-01"

          [[d1_databases]]
          binding = "DB"
          database_name = "$DB_NAME"
          database_id = "$DB_ID"
          TOML
          sed -i 's/^          //' wrangler.toml
          cat wrangler.toml

      - name: Create Pages project (first run only)
        if: steps.check.outputs.ok == 'true'
        run: |
          if ! npx wrangler pages project list > pages.out 2>&1; then
            cat pages.out
            echo "::error::The API token is not allowed to use Cloudflare Pages. Edit the token and add  Account · Cloudflare Pages · Edit."
            exit 1
          fi
          if grep -q "$PROJECT" pages.out; then echo "Pages project already exists"; else npx wrangler pages project create "$PROJECT" --production-branch=main; fi

      # The repo's default branch is the live site (production); other branches get preview links.
      - name: Deploy
        if: steps.check.outputs.ok == 'true'
        run: |
          BRANCH="$GITHUB_REF_NAME"
          if [ "$BRANCH" = "$DEFAULT_BRANCH" ]; then BRANCH=main; fi
          npx wrangler pages deploy --branch="$BRANCH" --commit-dirty=true
